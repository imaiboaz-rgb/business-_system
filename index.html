<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise POS AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="style.css">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- BARCODE -->
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
.hidden { display: none; }
.chat-msg { margin-bottom: 10px; padding: 5px; border-radius: 5px; }
.user { background: #1f2937; text-align: right; }
.ai { background: #2563eb; }
</style>
</head>
<body>
<header>
<h1>🤖 Enterprise POS AI</h1>
<p>Machine Learning Inventory System</p>
</header>
<div class="container">
<div class="card" id="loginBox">
<h2>Secure Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
</div>
<div id="app" class="hidden">
<div class="topbar">
<h3 id="userInfo"></h3>
<div class="actions">
<button onclick="toggleTheme()">Theme</button>
<button onclick="logout()">Logout</button>
</div>
</div>
<div class="card">
<h2>📈 Analytics Dashboard</h2>
<div class="chart-container"><canvas id="analyticsChart"></canvas></div>
<div id="forecastInsights"></div>
</div>
<div class="card">
<h2>📷 Barcode Scanner</h2>
<div id="reader"></div>
<button onclick="startScanner()">Start Scanner</button>
</div>
<div class="card">
<h2>📦 Inventory</h2>
<table>
<thead><tr><th>Product</th><th>Price</th><th>Stock</th></tr></thead>
<tbody id="productTable"></tbody>
</table>
</div>
<div class="card">
<h2>💰 Cart System</h2>
<select id="saleProduct"></select>
<input id="qty" type="number" placeholder="Quantity">
<button onclick="addToCart()">Add To Cart</button>
<div id="cart" style="margin-top: 10px; border: 1px solid #334155; padding: 10px;"></div>
<button onclick="checkout()">Checkout</button>
</div>
<div class="card">
<h2>🧠 AI Assistant</h2>
<div id="chatMessages" style="height: 150px; overflow-y: auto; background: #0b1220; margin-bottom: 10px; padding: 10px;"></div>
<input id="chatInput" placeholder="Ask AI">
<button onclick="sendChat()">Ask AI</button>
</div>
</div>
</div>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/analytics.js"></script>
<script src="js/scanner.js"></script>
<script src="js/inventory.js"></script>
<script src="js/sales.js"></script>
<script src="js/ai.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
